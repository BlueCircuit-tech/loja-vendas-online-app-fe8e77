    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; }
        .moldura-app {
            width: 100%; max-width: 390px; height: 100vh; max-height: 844px;
            margin: 0 auto; position: relative; overflow: hidden;

        }
        @media (min-width: 768px) {
            body { display: flex; align-items: center; justify-content: center; padding: 16px; }

                height: min(844px, 100vh - 32px); border-radius: 44px;
                border: 6px solid #1e293b; box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 2px #334155;
            }
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        [data-tela] { animation: fadeSlideIn .28s ease-out; }
        [data-tela].hidden { display: none !important; }
        .barra-status { font-family: 'Plus Jakarta Sans', sans-serif; }
        .nav-app {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 50;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(14px) saturate(180%);

            border-top: 1px solid rgba(226,232,240,0.7); box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: none; background: none; cursor: pointer; transition: color .2s; color: #94a3b8; font-size: 10.5px; font-weight: 600; font-family: 'Plus Jakarta Sans',sans-serif; position: relative; min-width: 0; flex: 1; }
        .nav-btn::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%) scaleX(0);
            width: 32px; height: 3px; border-radius: 0 0 3px 3px; transition: transform .25s cubic-bezier(.4,0,.2,1);
        }
        .nav-btn.ativo { color: #4f46e5; }
        .nav-btn.ativo::before { background: #4f46e5; transform: translateX(-50%) scaleX(1); }
        .nav-btn svg { transition: transform .2s; }
        .nav-btn:active svg { transform: scale(0.88); }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        *:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; border-radius: 6px; }
        .badge {
            display: inline-flex; align-items: center; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 700;
            font-family: 'Plus Jakarta Sans',sans-serif; letter-spacing: 0.01em;
        }
        .card {
            background: #fff; border-radius: 1rem; padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            transition: box-shadow .2s, transform .15s;
        }
        .card:active { transform: scale(0.985); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 24px; border-radius: 14px; font-weight: 700; font-size: 15px;
            border: none; cursor: pointer; font-family: 'Plus Jakarta Sans',sans-serif;
            transition: all .2s; white-space: nowrap;
        }
        .btn:active { transform: scale(0.96); }
        #toast-container { position: absolute; top: 52px; left: 12px; right: 12px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast-item {
            pointer-events: auto; padding: 14px 18px; border-radius: 14px;
            color: #fff; font-size: 13.5px; font-weight: 600;
            font-family: 'Plus Jakarta Sans',sans-serif;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: toastIn .35s cubic-bezier(.4,0,.2,1);
            display: flex; align-items: center; gap: 10px;
        }
        .toast-item.sair { animation: toastOut .3s ease-in forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-16px) scale(0.9); } }
        .toast-ok { background: #059669; }
        .toast-erro { background: #dc2626; }
        .toast-info { background: #4f46e5; }
        #modal-overlay {
            position: absolute; inset: 0; z-index: 150; background: rgba(15,23,42,0.55);
            backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity .22s;
        }
        #modal-overlay.aberto { opacity: 1; pointer-events: auto; }
        #modal-overlay.aberto #modal-cartao { transform: translateY(0); }
        #modal-cartao {
            background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-height: 78%;
            overflow-y: auto; padding: 20px; transform: translateY(100%);
            transition: transform .32s cubic-bezier(.4,0,.2,1);
        }
        @media (min-width: 768px) {
            #modal-overlay { align-items: center; }
            #modal-cartao { border-radius: 24px; max-width: 360px; max-height: 70%; transform: translateY(20px) scale(0.95); }
            #modal-overlay.aberto #modal-cartao { transform: translateY(0) scale(1); }
        }
        .produto-img {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);

        }
        .qtd-btn {
            width: 32px; height: 32px; border-radius: 10px; border: 2px solid #e2e8f0;
            background: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; font-weight: 700; color: #475569;

        .skeleton { background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:12px; }

        .pulse-dot { width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse-dot 2s infinite; }

            grid.classList.add('hidden');
            vazio.classList.remove('hidden');
            return;
          }
          grid.classList.remove('hidden');
          vazio.classList.add('hidden');
          var html = '';
          produtos.forEach(function(p) {
            var isFav = catalogo_de_produtos_favoritos.indexOf(p.id) !== -1;
            html += '<div class="card bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg active:scale-[0.97] transition-all cursor-pointer" onclick="catalogo_de_produtos_abrirDetalhe(' + p.id + ')">';
            html += '<div class="relative">';
            html += '<div class="h-36 flex items-center justify-center" style="background: linear-gradient(135deg, ' + p.cor + '22, ' + p.cor + '44)">';
            html += '<span class="text-5xl">' + p.icone + '</span>';
            html += '</div>';
            if (p.desconto > 0) {
              html += '<span class="badge absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">-' + p.desconto + '%</span>';
            }
            html += '<button onclick="event.stopPropagation(); catalogo_de_produtos_toggleFavorito(' + p.id + ', this)" class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center rounded-full bg-white/80 backdrop-blur-sm hover:bg-white active:scale-90 transition-all">';
            html += '<svg class="w-4 h-4 ' + (isFav ? 'text-red-500 fill-current' : 'text-gray-400') + '" fill="' + (isFav ? 'currentColor' : 'none') + '" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>';
            html += '</button>';
            html += '</div>';
            html += '<div class="p-3">';
            html += '<h3 class="text-sm font-semibold text-gray-800 font-display leading-tight mb-1 line-clamp-2">' + p.nome + '</h3>';
            html += '<div class="flex items-center gap-1 mb-2">';
            html += '<svg class="w-3.5 h-3.5 text-yellow-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
            html += '<span class="text-xs text-gray-500">' + p.avaliacao + ' (' + p.avaliacoes + ')</span>';
            html += '</div>';
            html += '<div class="flex items-end gap-2">';
            html += '<span class="text-lg font-bold text-emerald-600 font-display">' + brl(p.preco) + '</span>';
            if (p.precoAntigo) {
              html += '<span class="text-xs text-gray-400 line-through mb-0.5">' + brl(p.precoAntigo) + '</span>';
            }
            html += '</div>';
            html += '<span class="text-[10px] text-gray-400 mt-1 block">' + p.vendidos.toLocaleString('pt-BR') + ' vendidos</span>';
            html += '</div>';
            html += '</div>';
          });
          grid.innerHTML = html;
        }

        function catalogo_de_produtos_filtrar() {
          var termo = document.getElementById('catalogo-de-produtos-busca').value.toLowerCase().trim();
          var filtrados = catalogo_de_produtos_produtos.filter(function(p) {
            var matchCat = catalogo_de_produtos_categoriaAtual === 'todos' || p.categoria === catalogo_de_produtos_categoriaAtual;
            var matchBusca = p.nome.toLowerCase().indexOf(termo) !== -1;
            var matchPreco = true;
            if (catalogo_de_produtos_filtroPreco === 'menor50') matchPreco = p.preco <= 50;
            else if (catalogo_de_produtos_filtroPreco === '50a200') matchPreco = p.preco > 50 && p.preco <= 200;
            else if (catalogo_de_produtos_filtroPreco === 'maior200') matchPreco = p.preco > 200;
            return matchCat && matchBusca && matchPreco;
          });
          catalogo_de_produtos_renderizar(filtrados);
        }

        function catalogo_de_produtos_selecionarCategoria(btn, cat) {
          document.querySelectorAll('.catalogo-de-produtos-cat-chip').forEach(function(c) {
            c.classList.remove('bg-marca-600', 'text-white', 'shadow-md', 'shadow-marca-200');
            c.classList.add('bg-gray-100', 'text-gray-600');
          });
          btn.classList.remove('bg-gray-100', 'text-gray-600');
          btn.classList.add('bg-marca-600', 'text-white', 'shadow-md', 'shadow-marca-200');
          catalogo_de_produtos_categoriaAtual = cat;
          catalogo_de_produtos_filtrar();
        }

        function catalogo_de_produtos_toggleFiltros() {
          var el = document.getElementById('catalogo-de-produtos-filtros');
          el.classList.toggle('hidden');
        }

        function catalogo_de_produtos_filtrarPreco(preco) {
          document.querySelectorAll('.catalogo-de-produtos-btn-preco').forEach(function(b) {
            b.classList.remove('bg-marca-50', 'text-marca-700', 'border-marca-200');
            b.classList.add('bg-gray-50', 'text-gray-600', 'border-gray-200');
          });
          var ativo = document.querySelector('[data-preco="' + preco + '"]');
          ativo.classList.remove('bg-gray-50', 'text-gray-600', 'border-gray-200');
          ativo.classList.add('bg-marca-50', 'text-marca-700', 'border-marca-200');
          catalogo_de_produtos_filtroPreco = preco;
          catalogo_de_produtos_filtrar();
        }

        function catalogo_de_produtos_limparFiltros() {
          catalogo_de_produtos_filtroPreco = 'todos';
          document.querySelectorAll('.catalogo-de-produtos-btn-preco').forEach(function(b) {
            b.classList.remove('bg-marca-50', 'text-marca-700', 'border-marca-200');
            b.classList.add('bg-gray-50', 'text-gray-600', 'border-gray-200');
          });
          var todos = document.querySelector('[data-preco="todos"]');
          if (todos) {
            todos.classList.remove('bg-gray-50', 'text-gray-600', 'border-gray-200');
            todos.classList.add('bg-marca-50', 'text-marca-700', 'border-marca-200');
          }
          document.getElementById('catalogo-de-produtos-busca').value = '';
          catalogo_de_produtos_categoriaAtual = 'todos';
          var cats = document.querySelectorAll('.catalogo-de-produtos-cat-chip');
          cats.forEach(function(c) {
            c.classList.remove('bg-marca-600', 'text-white', 'shadow-md', 'shadow-marca-200');
            c.classList.add('bg-gray-100', 'text-gray-600');
          });
          if (cats[0]) {
            cats[0].classList.remove('bg-gray-100', 'text-gray-600');
            cats[0].classList.add('bg-marca-600', 'text-white', 'shadow-md', 'shadow-marca-200');
          }
          catalogo_de_produtos_filtrar();
        }

        function catalogo_de_produtos_toggleFavorito(produtoId, btn) {
          var idx = catalogo_de_produtos_favoritos.indexOf(produtoId);
          if (idx === -1) {
            catalogo_de_produtos_favoritos.push(produtoId);
            toast('Produto adicionado aos favoritos', 'ok');
          } else {
            catalogo_de_produtos_favoritos.splice(idx, 1);
            toast('Produto removido dos favoritos', 'info');
          }
          localStorage.setItem('bc_favoritos', JSON.stringify(catalogo_de_produtos_favoritos));
          catalogo_de_produtos_filtrar();
        }

        function catalogo_de_produtos_adicionarCarrinho(produtoId) {
          var produto = catalogo_de_produtos_produtos.find(function(p) { return p.id === produtoId; });
          if (!produto) return;
          var existente = catalogo_de_produtos_carrinho.find(function(item) { return item.id === produtoId; });
          if (existente) {
            existente.qtd = (existente.qtd || 1) + 1;
          } else {
            catalogo_de_produtos_carrinho.push({ id: produtoId, qtd: 1 });
          }
          localStorage.setItem('bc_carrinho', JSON.stringify(catalogo_de_produtos_carrinho));
          catalogo_de_produtos_atualizarCarrinho();
          toast(produto.nome + ' adicionado ao carrinho', 'ok');
        }

        function catalogo_de_produtos_atualizarCarrinho() {
          var count = 0;
          var total = 0;
          catalogo_de_produtos_carrinho.forEach(function(item) {
            var produto = catalogo_de_produtos_produtos.find(function(p) { return p.id === item.id; });
            if (produto) {
              count += item.qtd;
              total += produto.preco * item.qtd;
            }
          });
          var countEl = document.getElementById('catalogo-de-produtos-cart-count');
          var totalEl = document.getElementById('catalogo-de-produtos-cart-total');
          if (count > 0) {
            countEl.textContent = count;
            countEl.classList.remove('hidden');
          } else {
            countEl.classList.add('hidden');
          }
          totalEl.textContent = brl(total);
        }

        function catalogo_de_produtos_abrirDetalhe(produtoId) {
          var produto = catalogo_de_produtos_produtos.find(function(p) { return p.id === produtoId; });
          if (!produto) return;
          var estrelas = '';
          for (var i = 1; i <= 5; i++) {
            if (i <= Math.floor(produto.avaliacao)) {
              estrelas += '<svg class="w-5 h-5 text-yellow-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
            } else if (i - produto.avaliacao < 1) {
              estrelas += '<svg class="w-5 h-5 text-yellow-400 fill-current" viewBox="0 0 20 20" style="opacity:0.5"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
            } else {
              estrelas += '<svg class="w-5 h-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
            }
          }
          var precoAntigoHtml = produto.precoAntigo ? '<span class="text-gray-400 line-through text-base ml-2">' + brl(produto.precoAntigo) + '</span>' : '';
          var descontoHtml = produto.desconto > 0 ? '<span class="bg-red-100 text-red-600 text-xs font-bold px-2 py-1 rounded-full ml-2">-' + produto.desconto + '%</span>' : '';
          var parcelamento = produto.preco > 100 ? '<p class="text-sm text-gray-500 mt-1">ou em até 3x de <strong>' + brl(produto.preco / 3) + '</strong> sem juros</p>' : '';
          var html = '<div class="space-y-4">';
          html += '<div class="h-48 flex items-center justify-center rounded-xl" style="background: linear-gradient(135deg, ' + produto.cor + '22, ' + produto.cor + '44)">';
          html += '<span class="text-7xl">' + produto.icone + '</span>';
          html += '</div>';
          html += '<div>';
          html += '<h2 class="text-xl font-bold text-gray-900 font-display">' + produto.nome + '</h2>';
          html += '<div class="flex items-center gap-1 mt-1">' + estrelas + '<span class="text-sm text-gray-500 ml-1">' + produto.avaliacao + ' (' + produto.avaliacoes + ' avaliações)</span></div>';
          html += '</div>';
          html += '<div class="bg-gray-50 rounded-xl p-3">';
          html += '<div class="flex items-center gap-1 flex-wrap"><span class="text-2xl font-bold text-emerald-600 font-display">' + brl(produto.preco) + '</span>' + precoAntigoHtml + descontoHtml + '</div>';
          html += parcelamento;
          html += '</div>';
          html += '<div>';
          html += '<h3 class="text-sm font-semibold text-gray-700 mb-1">Descrição</h3>';
          html += '<p class="text-sm text-gray-600 font-body leading-relaxed">' + produto.descricao + '</p>';
          html += '</div>';
          html += '<div class="grid grid-cols-2 gap-3">';
          html += '<div class="bg-gray-50 rounded-xl p-3 text-center"><p class="text-lg font-bold text-gray-800">' + produto.vendidos.toLocaleString('pt-BR') + '</p><p class="text-xs text-gray-500">Vendidos</p></div>';
          html += '<div class="bg-gray-50 rounded-xl p-3 text-center"><p class="text-lg font-bold text-emerald-600">Frete grátis</p><p class="text-xs text-gray-500">Entrega</p></div>';
          html += '</div>';
          html += '<div class="flex gap-2 pt-2">';
          html += '<button onclick="catalogo_de_produtos_adicionarCarrinho(' + produto.id + '); fecharModal();" class="flex-1 bg-marca-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95 transition-all shadow-lg shadow-marca-200 hover:bg-marca-700">Adicionar ao Carrinho</button>';
          html += '<button onclick="catalogo_de_produtos_adicionarCarrinho(' + produto.id + '); fecharModal(); mostrarTela(\'checkout\');" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95 transition-all shadow-lg shadow-emerald-200 hover:bg-emerald-700">Comprar Agora</button>';
          html += '</div>';
          html += '</div>';
          abrirModal(html, 'Detalhe do Produto');
        }

        catalogo_de_produtos_renderizar(catalogo_de_produtos_produtos);
        catalogo_de_produtos_atualizarCarrinho();
      </script>

<script>
function mostrarTela(id) {
    document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
    });
    document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
    });
    window.scrollTo({ top: 0 });
}

function toast(mensagem, tipo) {
    var c = document.getElementById('toast-container');
    var el = document.createElement('div');
    var icones = { ok: '✓', erro: '✕', info: 'ℹ' };
    el.className = 'toast-item toast-' + (tipo || 'info');
    el.innerHTML = '<span style="font-size:15px;font-weight:800">' + (icones[tipo] || 'ℹ') + '</span>' + mensagem;
    c.appendChild(el);
    setTimeout(function () {
        el.classList.add('sair');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, 3000);
}

function abrirModal(html, titulo) {
    var overlay = document.getElementById('modal-overlay');
    var cartao = document.getElementById('modal-cartao');
    cartao.innerHTML = '<div class="flex items-center justify-between mb-4"><h3 class="font-display font-700 text-lg text-slate-800">' + (titulo || '') + '</h3><button onclick="fecharModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>' + html;
    overlay.classList.add('aberto');
    document.addEventListener('keydown', escFechar);
}
function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('aberto');
    document.removeEventListener('keydown', escFechar);
}
function escFechar(e) { if (e.key === 'Escape') fecharModal(); }

function brl(valor) {
    return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function dataBR(iso) {
    if (!iso) return '—';
    var d = new Date(iso + 'T03:00:00');
    return d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear();
}

// Relógio da barra de status
function atualizarRelogio() {
    var agora = new Date();
    var h = agora.getHours().toString().padStart(2, '0');
    var m = agora.getMinutes().toString().padStart(2, '0');
    var el = document.getElementById('relogio');
    if (el) el.textContent = h + ':' + m;
}
atualizarRelogio();
setInterval(atualizarRelogio, 30000);

document.addEventListener('DOMContentLoaded', function () {
    mostrarTela('catalogo-de-produtos');
});
</script>
